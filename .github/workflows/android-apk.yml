name: Build RoomMate Expenses Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
  RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
  RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
  RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        run: gradle clean assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoomMateExpenses-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish signed APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n 1)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          TAG="v${VERSION_NAME}"
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          {
            echo "RoomMate Expenses ${VERSION_NAME}"
            echo "versionCode=${VERSION_CODE}"
            echo "sha256=${SHA256}"
          } > release-notes.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "RoomMate Expenses ${VERSION_NAME}" --notes-file release-notes.txt
          else
            gh release create "$TAG" "$APK" --title "RoomMate Expenses ${VERSION_NAME}" --notes-file release-notes.txt
          fi

      - name: Send update push notification
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re, subprocess, tempfile, time, urllib.parse, urllib.request

          def b64url(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode("ascii")

          try:
              source = open("app/build.gradle.kts", encoding="utf-8").read()
              version_code = re.search(r'versionCode\s*=\s*(\d+)', source).group(1)
              version_name = re.search(r'versionName\s*=\s*"([^"]+)"', source).group(1)
              service_account = json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])
              now = int(time.time())
              header = b64url(json.dumps({"alg": "RS256", "typ": "JWT"}, separators=(",", ":")).encode())
              claims = b64url(json.dumps({
                  "iss": service_account["client_email"],
                  "sub": service_account["client_email"],
                  "aud": "https://oauth2.googleapis.com/token",
                  "iat": now,
                  "exp": now + 3600,
                  "scope": "https://www.googleapis.com/auth/firebase.messaging"
              }, separators=(",", ":")).encode())
              unsigned = f"{header}.{claims}"
              with tempfile.NamedTemporaryFile("w", suffix=".pem", delete=False) as key_file:
                  key_file.write(service_account["private_key"])
                  key_path = key_file.name
              try:
                  signature = subprocess.check_output(
                      ["openssl", "dgst", "-sha256", "-sign", key_path],
                      input=unsigned.encode()
                  )
              finally:
                  os.unlink(key_path)
              assertion = f"{unsigned}.{b64url(signature)}"
              token_body = urllib.parse.urlencode({
                  "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
                  "assertion": assertion
              }).encode()
              token_request = urllib.request.Request(
                  "https://oauth2.googleapis.com/token",
                  data=token_body,
                  headers={"Content-Type": "application/x-www-form-urlencoded"}
              )
              with urllib.request.urlopen(token_request, timeout=30) as response:
                  access_token = json.load(response)["access_token"]

              title = "RoomMate Expenses update"
              body = f"Version {version_name} is ready to install."
              payload = {
                  "message": {
                      "topic": "updates",
                      "notification": {"title": title, "body": body},
                      "data": {
                          "eventId": f"update-{version_code}",
                          "type": "update",
                          "title": title,
                          "body": body,
                          "versionCode": version_code,
                          "versionName": version_name
                      }
                  }
              }
              project_id = service_account["project_id"]
              fcm_request = urllib.request.Request(
                  f"https://fcm.googleapis.com/v1/projects/{project_id}/messages:send",
                  data=json.dumps(payload).encode(),
                  headers={
                      "Authorization": f"Bearer {access_token}",
                      "Content-Type": "application/json"
                  }
              )
              with urllib.request.urlopen(fcm_request, timeout=30) as response:
                  print("FCM push sent:", response.read().decode()[:200])
          except Exception as error:
              print(f"FCM push skipped: {error}")
          PY
