
name: Build RoomMate Expenses APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          unzip -q RoomMateExpenses_Source_Updated_Fixed.zip -d .
          test -f RoomMateExpenses/app/google-services.json

      - name: Build APK
        run: gradle -p RoomMateExpenses assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoomMateExpenses-debug-apk
          path: RoomMateExpenses/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
